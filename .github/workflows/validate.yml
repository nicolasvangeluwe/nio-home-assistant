name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check custom_components/nio_telematics/nio-vehicle-card.js
      - run: node --check custom_components/nio_telematics/car_dashboard/car-ledger-card.js
      - run: node --test tests/test_vehicle_dashboard_frontend.cjs tests/test_ledger_locales.cjs tests/test_vehicle_card_locales.cjs

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements_test.txt
      - run: python -m pytest

  ha-oauth-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - home-assistant: "2026.7.0"
            python: "3.14"
          - home-assistant: "2026.11.0"
            python: "3.14"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.python }}"
      - run: python -m pip install "homeassistant==${{ matrix.home-assistant }}"
      - name: Import integration OAuth modules
        run: >-
          python -c "from homeassistant.exceptions import OAuth2TokenRequestError, OAuth2TokenRequestReauthError, OAuth2TokenRequestTransientError; from custom_components.nio_telematics import api, application_credentials, coordinator"

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
