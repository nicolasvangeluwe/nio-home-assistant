name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check custom_components/nio_telematics/nio-vehicle-card.js
      - run: node --check custom_components/nio_telematics/car_dashboard/car-ledger-card.js
      - run: node --check custom_components/nio_telematics/nio-dashboard-history.js
      - run: node --check custom_components/nio_telematics/nio-vehicle-panel.js
      - run: node --test tests/test_vehicle_dashboard_frontend.cjs tests/test_ledger_locales.cjs tests/test_vehicle_card_locales.cjs tests/test_dashboard_history_frontend.cjs tests/test_managed_panel_frontend.cjs tests/test_native_locale_catalogues.cjs

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements_test.txt
      - name: Compare issue 21 replay with previous release
        run: python .github/scripts/replay_issue21_baseline.py
      - run: python -m pytest -vv --timeout=45 --junitxml=pytest-results.xml
      - name: Record polling comparison measurements
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          if not Path('pytest-results.xml').exists():
              raise SystemExit('No completed pytest report was produced')
          for case in ET.parse('pytest-results.xml').iter('testcase'):
              properties = case.find('properties')
              if properties is not None:
                  print(case.attrib['name'], json.dumps({p.attrib['name']: p.attrib['value'] for p in properties}))
          PY

  ha-oauth-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - home-assistant: "2026.7.0"
            python: "3.14"
          - home-assistant: "2026.11.0"
            python: "3.14"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.python }}"
      - run: python -m pip install "homeassistant==${{ matrix.home-assistant }}"
      - name: Import integration OAuth modules
        run: >-
          python -c "from homeassistant.exceptions import OAuth2TokenRequestError, OAuth2TokenRequestReauthError, OAuth2TokenRequestTransientError; from custom_components.nio_telematics import api, application_credentials, coordinator"

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
