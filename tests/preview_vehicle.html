<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIO dashboard preview — example data</title>
<style>
body{margin:0;background:#f1f3f4;color:#22303a;font-family:Arial,sans-serif;--card-background-color:#fff;--primary-text-color:#22303a;--secondary-text-color:#6b757b;--divider-color:#d7dfe3;--primary-color:#4d766f}
body.dark{background:#161b1f;color:#e5e9eb;--card-background-color:#242a2e;--primary-text-color:#e5e9eb;--secondary-text-color:#a8b0b4;--divider-color:#465057;--primary-color:#7ca9a0}
main{max-width:820px;margin:28px auto;padding:0 16px}.sample{font-size:12px;color:var(--secondary-text-color);margin:0 0 12px;text-align:right}
ha-card{display:block}
</style>
<main><p class="sample">DESIGN PREVIEW · EXAMPLE DATA · NOT LIVE HA</p><nio-vehicle-card></nio-vehicle-card></main>
<script>window.onerror=(message,source,line)=>{document.body.insertAdjacentHTML('beforeend',`<pre style="color:red">${message} · ${line}</pre>`);};</script>
<script src="../custom_components/nio_telematics/nio-vehicle-card.js?v=4"></script>
<script>
if(location.search.includes('dark=1'))document.body.classList.add('dark');
const stamp='2026-10-10T15:13:44Z';
const states={
  'sensor.example_soc':{state:'54.5',attributes:{last_valid_sample:stamp,data_retained:false}},
  'sensor.example_range':{state:'301',attributes:{last_valid_sample:stamp}},
  'sensor.example_odometer':{state:'6208',attributes:{}},
  'sensor.example_limit':{state:'90',attributes:{}},
  'sensor.example_charging':{state:'not_charging',attributes:{}},
};
const vehicle={entry_id:'example',name:'ET5 Touring',entities:{battery_state_of_charge:'sensor.example_soc',remaining_range:'sensor.example_range',odometer:'sensor.example_odometer',maximum_soc:'sensor.example_limit',charging_state:'sensor.example_charging'},preferences:{model:'ET5 Touring',language:new URLSearchParams(location.search).get('lang')||'en',evcc_connected:'',evcc_power:'',evcc_history:'',electricity_price:'',reimbursement_rate:'',battery_capacity_kwh:90},ledger_available:false};
const card=document.querySelector('nio-vehicle-card');card.setConfig({entry_id:'example'});card.hass={language:'en',states,callWS:async()=>({vehicles:[vehicle]})};
</script>
</html>
